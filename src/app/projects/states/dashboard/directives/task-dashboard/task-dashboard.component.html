<div class="w-full h-full overflow-auto">
  <!-- <f-project-progress></f-project-progress> -->

  <ng-container [ngSwitch]="currentView">
    <ng-template [ngSwitchCase]="DashboardViews.task">
      <ng-container
        *ngIf="task?.definition.hasTaskSheet; then pdfViewer; else noPdfUrl"
      ></ng-container>
    </ng-template>

    <ng-template [ngSwitchCase]="DashboardViews.submission">
      <ng-container
        *ngIf="task?.hasSubmissionPdf; then pdfViewer; else noPdfUrl"
      ></ng-container>
    </ng-template>

    <ng-template [ngSwitchCase]="DashboardViews.similarity">
      <f-task-similarity-view [task]="task"></f-task-similarity-view>
    </ng-template>

    <ng-template [ngSwitchCase]="DashboardViews.taskDetails">
      <f-task-details [task]="task" [currentView$]="currentView$"></f-task-details>
    </ng-template>
  </ng-container>

  <!-- The PDF Viewer -->
  <ng-template #pdfViewer>
    <f-pdf-viewer [pdfUrl]="pdfUrl" [startPage]="startPage"></f-pdf-viewer>
  </ng-template>

  <!-- Render if no PDF URL is available for the current view -->
  <ng-template #noPdfUrl>
    <div class="flex flex-col w-full h-full justify-center items-center">
      <mat-icon>subtitles_off</mat-icon>
    </div>
  </ng-template>
</div>
