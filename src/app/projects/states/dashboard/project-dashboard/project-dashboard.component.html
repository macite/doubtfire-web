<div class="w-full h-full" *ngIf="project$ | async as project">
  <div class="flex flex-row">
    <div id="leftcomponent" #leftcomponent class="task-list task-panel">
      <f-unit-task-list
        class="min-w-[300px] w-1/2"
        *ngIf="project.unit.taskDefinitions.length > 0"
        [mode]="'project'"
        [taskDefinitions]="project.unit.taskDefinitions"
        [tasks]="projectTasks"
        [selectedTaskDefinition$]="selectedTaskDefinition$"
        [selectedTask$]="selectedTask$"
        [targetGradeChange$]="targetGradeChange$"
      ></f-unit-task-list>
    </div>

    @if (subs$ | async) {
      <div
        id="leftResizerEl"
        #leftResizerEl
        class="resizer"
        cdkDragLockAxis="x"
        cdkDrag
        (cdkDragMoved)="dragging($event, leftcomponent)"
        (cdkDragEnded)="stoppedDragging($event, leftcomponent)"
        (cdkDragStarted)="startedDragging($event, leftcomponent)"
      ></div>
    }

    <f-project-progress-dashboard
      class="w-full"
      [project$]="project$"
      [selectedTaskDefinition$]="selectedTaskDefinition$"
      [targetGradeChange$]="targetGradeChange$"
      [hidden]="selectedTask"
    ></f-project-progress-dashboard>

    @if (selectedTask) {
      <f-task-dashboard
        class="inbox-panel grow"
        [currentView$]="currentView$"
        [task]="selectedTask"
        [startPage]="1"
        >
      </f-task-dashboard>
      <div #commentspanel class="task-comment-panel inbox-panel">
        <task-comments-viewer [task]="selectedTask"> </task-comments-viewer>
      </div>
    }
  </div>
</div>
